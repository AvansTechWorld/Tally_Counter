<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Take</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
  :root {
    --paper: #FBFAF7;
    --card: #FFFFFF;
    --raised: #FFFFFF;
    --hover: #FFF4EC;
    --active: #FFE9D9;
    --ink: #1B1812;
    --ink-soft: #6E6A62;
    --ink-faint: #A9A399;
    --orange: #FF5A1F;
    --orange-deep: #D6440A;
    --orange-tint: #FFF1E8;
    --orange-tint-2: #FFE4D3;
    --line: #E9E4DA;
    --line-strong: #D9D2C4;
    --danger: #B3382A;
    --danger-tint: #FBEAE7;
    --ok: #2E7D57;
    --ok-tint: #E9F5EE;
    --radius: 10px;
    --radius-sm: 7px;
    --shadow: 0 1px 2px rgba(27,24,18,0.04), 0 8px 24px rgba(27,24,18,0.06);
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Archivo', sans-serif;
    background: var(--paper);
    color: var(--ink);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  :focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

  /* ── Top Bar ── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px;
    border-bottom: 1px solid var(--line);
    background: rgba(251,250,247,0.92);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
    position: relative; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon {
    width: 38px; height: 38px; border-radius: 9px;
    background: var(--ink);
    display: flex; align-items: center; justify-content: center;
    color: var(--orange); font-size: 16px;
    position: relative;
  }
  .brand-icon::after {
    content: ''; position: absolute; inset: 0; border-radius: 9px;
    background: repeating-linear-gradient(90deg, transparent 0 3px, rgba(255,90,31,0.35) 3px 4px);
    opacity: 0.5; pointer-events: none;
  }
  .brand-text {
    font-weight: 800; font-size: 19px; letter-spacing: -0.4px; text-transform: uppercase;
  }
  .brand-text span { color: var(--orange); }
  .brand-text .tiny { display: block; font-size: 9.5px; font-weight: 600; letter-spacing: 1.6px; color: var(--ink-faint); text-transform: uppercase; margin-top: -2px; }

  .topbar-center { display: flex; align-items: center; gap: 8px; }
  .stat-pill {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    font-size: 12px; color: var(--ink-soft);
    font-weight: 500;
  }
  .stat-pill .val { color: var(--ink); font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
  .stat-pill.warn .val { color: var(--orange-deep); }
  .stat-pill.warn { border-color: var(--orange-tint-2); background: var(--orange-tint); }
  .stat-pill i { font-size: 11px; color: var(--ink-faint); }

  .topbar-actions { display: flex; gap: 8px; align-items: center; }

  /* ── Search Box ── */
  .search-box {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    width: 230px;
    transition: border-color 0.15s, box-shadow 0.15s, width 0.15s;
  }
  .search-box:focus-within {
    border-color: var(--orange);
    box-shadow: 0 0 0 3px var(--orange-tint);
    width: 270px;
  }
  .search-box i.fa-search { font-size: 12px; color: var(--ink-faint); flex-shrink: 0; }
  .search-box input {
    background: none; border: none; outline: none;
    color: var(--ink); font-family: inherit; font-size: 13px;
    flex: 1; min-width: 0;
  }
  .search-box input::placeholder { color: var(--ink-faint); }
  .search-clear {
    display: none; border: none; background: none; color: var(--ink-faint);
    cursor: pointer; font-size: 11px; padding: 2px; flex-shrink: 0;
  }
  .search-clear:hover { color: var(--ink); }
  .search-box.has-query .search-clear { display: block; }

  .mobile-menu-btn { display: none; }
  .sidebar-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(27,24,18,0.35);
    z-index: 19;
  }
  .sidebar-overlay.show { display: block; }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 15px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    background: var(--card);
    color: var(--ink);
    font-size: 13px; font-family: inherit; font-weight: 600;
    cursor: pointer;
    transition: all 0.13s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--hover); border-color: var(--orange); }
  .btn-accent {
    background: var(--orange); color: #fff;
    border-color: var(--orange); font-weight: 700;
  }
  .btn-accent:hover { background: var(--orange-deep); border-color: var(--orange-deep); }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover { background: var(--danger-tint); border-color: var(--danger); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-ghost { border: none; background: transparent; padding: 6px 10px; }
  .btn-ghost:hover { background: var(--hover); }

  /* ── Layout ── */
  .layout { display: flex; flex: 1; overflow: hidden; position: relative; z-index: 1; }

  /* ── Sidebar ── */
  .sidebar {
    width: 264px; min-width: 264px;
    border-right: 1px solid var(--line);
    background: var(--paper);
    display: flex; flex-direction: column;
  }
  .sidebar-head {
    padding: 14px 16px 10px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .sidebar-head h3 {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.6px;
    color: var(--ink-faint); font-weight: 700;
  }
  .sidebar-tree { flex: 1; overflow-y: auto; padding: 6px 0; }
  .sidebar-tree::-webkit-scrollbar { width: 3px; }
  .sidebar-tree::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }

  .ti {
    display: flex; align-items: center;
    padding: 7px 14px 7px 0;
    cursor: pointer;
    transition: background 0.12s;
    user-select: none;
    position: relative;
    font-size: 13.5px;
  }
  .ti:hover { background: var(--hover); }
  .ti.active { background: var(--orange-tint); }
  .ti.active::before {
    content: ''; position: absolute; left: 0; top: 3px; bottom: 3px;
    width: 3px; background: var(--orange); border-radius: 0 3px 3px 0;
  }
  .ti.drag-over { background: var(--orange-tint); outline: 1px dashed var(--orange); outline-offset: -1px; }
  .ti-chev {
    width: 22px; height: 22px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-faint); font-size: 9px; transition: transform 0.2s;
  }
  .ti-chev.open { transform: rotate(90deg); }
  .ti-chev.blank { visibility: hidden; }
  .ti-ico {
    width: 24px; height: 24px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    margin-right: 8px; font-size: 13px; color: var(--orange-deep);
  }
  .ti-lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .ti-cnt {
    font-size: 10px; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace;
    background: var(--card); border: 1px solid var(--line); padding: 1px 7px; border-radius: 10px;
    margin-left: 6px; flex-shrink: 0;
  }
  .ti-children { display: none; }
  .ti-children.open { display: block; }

  /* ── Content ── */
  .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .content-head {
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .breadcrumb { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ink-soft); }
  .breadcrumb span { cursor: pointer; transition: color 0.12s; }
  .breadcrumb span:hover { color: var(--orange-deep); }
  .breadcrumb span.cur { color: var(--ink); font-weight: 700; cursor: default; }
  .breadcrumb .sep { color: var(--ink-faint); font-size: 9px; cursor: default; }
  .content-meta { font-size: 12px; color: var(--ink-faint); font-family: 'IBM Plex Mono', monospace; }

  .items-scroll { flex: 1; overflow-y: auto; padding: 20px 24px 40px; }
  .items-scroll::-webkit-scrollbar { width: 5px; }
  .items-scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }

  .counter-grid { display: grid; grid-template-columns: 1fr; gap: 12px; max-width: 680px; }

  /* ── Item Card (barcode-tag signature) ── */
  .cc {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 20px 16px 26px;
    position: relative;
    transition: all 0.16s;
    display: flex;
    align-items: center;
    gap: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .cc::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0; width: 8px;
    background: repeating-linear-gradient(180deg,
      var(--ink) 0 2px, transparent 2px 4px,
      var(--ink) 4px 5px, transparent 5px 9px,
      var(--ink) 9px 10px, transparent 10px 12px);
    opacity: 0.85;
  }
  .cc:hover { border-color: var(--orange); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(255,90,31,0.12), var(--shadow); }
  .cc.dragging { opacity: 0.35; }
  .cc-menu { position: absolute; top: 10px; right: 10px; opacity: 0; transition: opacity 0.15s; display: flex; gap: 2px; }
  .cc:hover .cc-menu, .cc:focus-within .cc-menu { opacity: 1; }
  @media (hover: none) { .cc-menu { opacity: 1; } }
  .cc-menu button {
    width: 27px; height: 27px; border: none; border-radius: 6px;
    background: var(--paper); color: var(--ink-faint); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; transition: all 0.12s;
  }
  .cc-menu button:hover { background: var(--orange-tint); color: var(--orange-deep); }
  .cc-menu button.del:hover { color: var(--danger); background: var(--danger-tint); }

  .cc-info { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .cc-name { font-size: 14.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cc-target { font-size: 11.5px; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; }
  .cc-badge {
    display: inline-flex; align-items: center; gap: 4px; width: fit-content;
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.6px; text-transform: uppercase;
    padding: 2px 8px; border-radius: 4px; border: 1px dashed;
    transform: rotate(-1.5deg);
  }
  .cc-badge.match { color: var(--ok); border-color: var(--ok); background: var(--ok-tint); }
  .cc-badge.over { color: var(--orange-deep); border-color: var(--orange); background: var(--orange-tint); }
  .cc-badge.short { color: var(--danger); border-color: var(--danger); background: var(--danger-tint); }

  .cc-display { display: flex; align-items: center; justify-content: center; gap: 14px; flex: 0 0 auto; }
  .cc-btn {
    width: 42px; height: 42px;
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    background: var(--paper);
    color: var(--ink);
    font-size: 19px; font-weight: 400;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s;
    font-family: 'Archivo', sans-serif;
  }
  .cc-btn:hover { background: var(--hover); border-color: var(--orange); }
  .cc-btn:active { transform: scale(0.93); }
  .cc-btn.minus:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-tint); }
  .cc-btn.plus:hover { border-color: var(--orange); color: var(--orange-deep); background: var(--orange-tint); }

  .cc-val {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 32px; font-weight: 700;
    min-width: 92px; text-align: center;
    letter-spacing: -1px;
    line-height: 1;
  }
  .cc-val.match { color: var(--ink); }
  .cc-val.over { color: var(--orange-deep); }
  .cc-val.short { color: var(--danger); }

  .cc-foot { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; font-size: 11px; color: var(--ink-faint); flex: 0 0 auto; }
  .cc-foot button {
    background: none; border: none; color: var(--ink-faint);
    cursor: pointer; font-size: 11px; font-family: inherit; font-weight: 600;
    padding: 2px 6px; border-radius: 4px; transition: all 0.12s;
  }
  .cc-foot button:hover { color: var(--orange-deep); background: var(--orange-tint); }
  .cc-step-badge { font-size: 10px; padding: 2px 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; color: var(--ink-soft); white-space: nowrap; font-family: 'IBM Plex Mono', monospace; }

  /* ── Location (folder) Card ── */
  .cc.is-folder { cursor: pointer; padding-left: 20px; }
  .cc.is-folder::before { display: none; }
  .cc.is-folder:hover { border-color: var(--orange); }
  .cc.is-folder .folder-ico {
    width: 42px; height: 42px; border-radius: 10px;
    background: var(--ink); color: var(--orange);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex: 0 0 auto;
  }
  .cc.is-folder .cc-name { text-align: left; }
  .cc.is-folder .cc-foot { flex-direction: row; align-items: center; }

  /* ── Empty State ── */
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px; text-align: center; color: var(--ink-faint); padding: 40px; }
  .empty i { font-size: 42px; opacity: 0.35; margin-bottom: 6px; color: var(--orange); }
  .empty p { font-size: 14px; max-width: 280px; line-height: 1.6; color: var(--ink-soft); }

  /* ── Modal ── */
  .modal-bg { position: fixed; inset: 0; background: rgba(27,24,18,0.35); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-bg.show { display: flex; }
  .modal-box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 26px; width: 400px; max-width: 92vw; box-shadow: 0 20px 56px rgba(27,24,18,0.22); animation: mIn 0.18s ease; }
  .modal-box h3 { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
  .modal-box .sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; }
  .modal-box label { display: block; font-size: 11px; font-weight: 700; color: var(--ink-faint); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.7px; }
  .modal-box input, .modal-box select {
    width: 100%; padding: 10px 13px;
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-sm);
    color: var(--ink); font-size: 14px; font-family: inherit; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s; margin-bottom: 14px;
  }
  .modal-box input:focus, .modal-box select:focus { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-tint); }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field-row > div { display: flex; flex-direction: column; }

  .move-list { max-height: 220px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 14px; }
  .move-list::-webkit-scrollbar { width: 3px; }
  .move-list::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }
  .move-opt { padding: 9px 13px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; transition: background 0.12s; border-bottom: 1px solid var(--line); }
  .move-opt:last-child { border-bottom: none; }
  .move-opt:hover { background: var(--hover); }
  .move-opt.sel { background: var(--orange-tint); color: var(--orange-deep); font-weight: 600; }
  .move-opt i { color: var(--orange); font-size: 12px; width: 16px; text-align: center; }

  /* ── Context Menu ── */
  .ctx { position: fixed; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 5px; min-width: 180px; box-shadow: 0 14px 40px rgba(27,24,18,0.18); z-index: 150; display: none; }
  .ctx.show { display: block; animation: mIn 0.12s ease; }
  .ctx-i { display: flex; align-items: center; gap: 9px; padding: 7px 11px; border-radius: 6px; font-size: 13px; cursor: pointer; transition: background 0.1s; color: var(--ink); font-weight: 500; }
  .ctx-i:hover { background: var(--hover); }
  .ctx-i.dng { color: var(--danger); }
  .ctx-i.dng:hover { background: var(--danger-tint); }
  .ctx-i i { width: 15px; text-align: center; font-size: 11px; color: var(--ink-faint); }
  .ctx-i.dng i { color: var(--danger); }
  .ctx-sep { height: 1px; background: var(--line); margin: 3px 8px; }

  /* ── Toast ── */
  .toast-box { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column-reverse; gap: 8px; }
  .toast { padding: 10px 16px; background: var(--ink); color: #fff; border-radius: var(--radius-sm); font-size: 13px; display: flex; align-items: center; gap: 9px; box-shadow: 0 10px 30px rgba(27,24,18,0.3); animation: tIn 0.25s ease; font-weight: 500; }
  .toast.ok i { color: var(--orange); }
  .toast.err i { color: #ff8f7a; }
  .toast.out { animation: tOut 0.25s ease forwards; }

  @keyframes mIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes tIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes tOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(50px); } }
  @keyframes popNum { 0% { transform: scale(1); } 50% { transform: scale(1.14); } 100% { transform: scale(1); } }
  .pop { animation: popNum 0.15s ease; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  @media (max-width: 700px) {
    .sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 20; transform: translateX(-100%); transition: transform 0.2s ease; background: var(--paper); width: 78vw; max-width: 300px; }
    .sidebar.open { transform: translateX(0); }
    .mobile-menu-btn { display: inline-flex; }
    .counter-grid { max-width: 100%; }
    .topbar-center .stat-pill { display: none; }
    .search-box { width: 100%; }
    .search-box:focus-within { width: 100%; }
    .btn-label { display: none; }
    .cc { flex-wrap: wrap; }
    .cc-menu { opacity: 1; position: static; margin-left: auto; order: 3; }
  }
  @media (max-width: 460px) {
    .cc-val { font-size: 26px; min-width: 68px; }
    .cc-btn { width: 38px; height: 38px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-icon"><i class="fas fa-boxes-stacked"></i></div>
    <div class="brand-text">Stock<span>Take</span><span class="tiny">Physical Inventory</span></div>
  </div>
  <div class="topbar-center">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input id="searchInput" type="text" placeholder="Search items and locations..." autocomplete="off" aria-label="Search items and locations">
      <button class="search-clear" id="searchClear" onclick="clearSearch()" aria-label="Clear search" title="Clear search"><i class="fas fa-times"></i></button>
    </div>
    <div class="stat-pill"><i class="fas fa-boxes-stacked"></i> <span class="val" id="statCounters">0</span> items</div>
    <div class="stat-pill" id="statVarPill"><i class="fas fa-triangle-exclamation"></i> <span class="val" id="statVar">0</span> off-count</div>
  </div>
  <div class="topbar-actions">
    <button class="btn btn-ghost mobile-menu-btn" onclick="toggleSidebar()" aria-label="Open locations menu" title="Locations"><i class="fas fa-bars"></i></button>
    <button class="btn" onclick="exportCSV()" aria-label="Export CSV" title="Export CSV"><i class="fas fa-file-export"></i> <span class="btn-label">Export</span></button>
    <button class="btn" onclick="openNewFolder()" aria-label="New location"><i class="fas fa-map-pin"></i> <span class="btn-label">New Location</span></button>
    <button class="btn btn-accent" onclick="openNewCounter()" aria-label="New item"><i class="fas fa-plus"></i> <span class="btn-label">New Item</span></button>
  </div>
</div>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="layout">
  <aside class="sidebar" role="navigation" aria-label="Locations">
    <div class="sidebar-head">
      <h3>Locations</h3>
      <button class="btn btn-ghost btn-sm" onclick="openNewFolder()" title="New location" aria-label="New location"><i class="fas fa-plus" style="font-size:11px"></i></button>
    </div>
    <div class="sidebar-tree" id="tree"></div>
  </aside>
  <main class="content">
    <div class="content-head">
      <div class="breadcrumb" id="bc"></div>
      <div class="content-meta" id="cmeta"></div>
    </div>
    <div class="items-scroll" id="itemsArea"></div>
  </main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal-box" id="modalBox" role="dialog" aria-modal="true"></div></div>
<div class="ctx" id="ctx"></div>
<div class="toast-box" id="toasts"></div>

<script>
  const STORAGE_KEY = 'stockTakeData_v1';

  // ── Default (first-run) data ──
  const defaultFolders = [
    { id: 1, name: 'Warehouse A', pid: null },
    { id: 2, name: 'Aisle 1 — Electronics', pid: 1 },
    { id: 3, name: 'Aisle 2 — Apparel', pid: 1 },
    { id: 4, name: 'Aisle 3 — Grocery', pid: 1 },
    { id: 5, name: 'Storeroom B', pid: null },
    { id: 6, name: 'Backstock', pid: 5 },
    { id: 7, name: 'Returns', pid: 5 },
    { id: 8, name: 'Front of House', pid: null },
    { id: 9, name: 'Display Shelving', pid: 8 },
  ];
  const defaultCounters = [
    { id: 50, name: 'Laptops', expected: 24, count: 22, step: 1, fid: 2 },
    { id: 51, name: 'Monitors', expected: 40, count: 38, step: 1, fid: 2 },
    { id: 52, name: 'USB Cables (packs)', expected: 150, count: 150, step: 5, fid: 2 },
    { id: 53, name: 'T-Shirts', expected: 60, count: 58, step: 1, fid: 3 },
    { id: 54, name: 'Jackets', expected: 15, count: 15, step: 1, fid: 3 },
    { id: 55, name: 'Water Bottles (case)', expected: 200, count: 210, step: 10, fid: 4 },
    { id: 56, name: 'Snack Packs', expected: 85, count: 80, step: 5, fid: 4 },
    { id: 57, name: 'Pallets', expected: 12, count: 12, step: 1, fid: 6 },
    { id: 58, name: 'Damaged Units', expected: 0, count: 4, step: 1, fid: 7 },
    { id: 59, name: 'Mannequin Outfits', expected: 10, count: 9, step: 1, fid: 9 },
    { id: 60, name: 'Misc Items', expected: 7, count: 7, step: 1, fid: null },
  ];

  let uid = 200;
  let folders, counters, expanded;
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (saved && Array.isArray(saved.folders) && Array.isArray(saved.counters)) {
      folders = saved.folders;
      counters = saved.counters.map(c => ({ expected: 0, ...c }));
      expanded = new Set(saved.expanded || []);
      uid = saved.uid || 200;
    }
  } catch (e) { /* corrupted storage — fall through to defaults */ }
  if (!folders) { folders = defaultFolders; counters = defaultCounters; expanded = new Set([1, 5, 8]); }

  const gid = () => ++uid;
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ folders, counters, uid, expanded: Array.from(expanded) }));
    } catch (e) { toast('Could not save — storage may be full or blocked', 'err'); }
  }

  let curFolder = null;
  let dragId = null;
  let searchQ = '';

  // ── Helpers ──
  const childFolders = pid => folders.filter(f => f.pid === pid).sort((a, b) => a.name.localeCompare(b.name));
  const folderCounters = fid => counters.filter(c => c.fid === fid).sort((a, b) => a.name.localeCompare(b.name));
  const descIds = fid => { let ids = [fid]; childFolders(fid).forEach(f => ids = ids.concat(descIds(f.id))); return ids; };
  const countInFolder = fid => counters.filter(c => descIds(fid).includes(c.fid)).length;
  const folderPath = fid => { const p = []; let c = folders.find(f => f.id === fid); while (c) { p.unshift(c); c = folders.find(f => f.id === c.pid); } return p; };
  const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
  const variance = c => c.count - c.expected;
  const varClass = v => v === 0 ? 'match' : v > 0 ? 'over' : 'short';
  const varLabel = v => v === 0 ? 'Match' : v > 0 ? `+${v} Over` : `\u2212${Math.abs(v)} Short`;

  // ── Toast ──
  function toast(msg, type = 'ok') {
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.innerHTML = `<i class="fas ${type === 'ok' ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i><span>${msg}</span>`;
    document.getElementById('toasts').appendChild(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 250); }, 2600);
  }

  // ── Stats ──
  function updateStats() {
    document.getElementById('statCounters').textContent = counters.length;
    const offCount = counters.filter(c => variance(c) !== 0).length;
    document.getElementById('statVar').textContent = offCount;
    document.getElementById('statVarPill').classList.toggle('warn', offCount > 0);
  }

  // ── Render Tree ──
  function renderTree() {
    const tree = document.getElementById('tree');
    let html = '';
    html += `<div class="ti${curFolder === null ? ' active' : ''}" style="padding-left:14px"
      onclick="event.stopPropagation();nav(null)"
      ondragover="event.preventDefault();this.classList.add('drag-over')"
      ondragleave="this.classList.remove('drag-over')"
      ondrop="event.preventDefault();this.classList.remove('drag-over');dropTo(null)"
      oncontextmenu="event.preventDefault()">
      <span class="ti-chev blank"><i class="fas fa-chevron-right"></i></span>
      <span class="ti-ico"><i class="fas fa-warehouse"></i></span>
      <span class="ti-lbl">All Items</span>
      <span class="ti-cnt">${counters.length}</span>
    </div>`;
    html += buildTreeLevel(null, 0);
    tree.innerHTML = html;
  }

  function buildTreeLevel(pid, depth) {
    return childFolders(pid).map(f => {
      const hasCh = childFolders(f.id).length > 0;
      const isOpen = expanded.has(f.id);
      const isAct = curFolder === f.id;
      const cnt = countInFolder(f.id);
      const pad = 14 + depth * 18;
      return `<div>
        <div class="ti${isAct ? ' active' : ''}" style="padding-left:${pad}px" data-fid="${f.id}"
          onclick="event.stopPropagation();nav(${f.id})"
          ondragover="event.preventDefault();this.classList.add('drag-over')"
          ondragleave="this.classList.remove('drag-over')"
          ondrop="event.preventDefault();this.classList.remove('drag-over');dropTo(${f.id})"
          oncontextmenu="event.preventDefault();folderCtx(event,${f.id})">
          <span class="ti-chev ${hasCh ? (isOpen ? 'open' : '') : 'blank'}" onclick="event.stopPropagation();togFolder(${f.id})">
            <i class="fas fa-chevron-right"></i>
          </span>
          <span class="ti-ico"><i class="fas ${isOpen ? 'fa-box-open' : 'fa-box'}"></i></span>
          <span class="ti-lbl">${esc(f.name)}</span>
          <span class="ti-cnt">${cnt}</span>
        </div>
        <div class="ti-children ${isOpen ? 'open' : ''}">${buildTreeLevel(f.id, depth + 1)}</div>
      </div>`;
    }).join('');
  }

  function nav(fid) { curFolder = fid; renderAll(); closeSidebar(); }
  function togFolder(fid) { expanded.has(fid) ? expanded.delete(fid) : expanded.add(fid); saveState(); renderTree(); }

  function toggleSidebar() {
    document.querySelector('.sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('show');
  }
  function closeSidebar() {
    document.querySelector('.sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('show');
  }

  function clearSearch() {
    const input = document.getElementById('searchInput');
    input.value = '';
    searchQ = '';
    document.querySelector('.search-box').classList.remove('has-query');
    renderItems(); renderMeta();
    input.focus();
  }

  function renderBC() {
    const bc = document.getElementById('bc');
    if (curFolder === null) { bc.innerHTML = '<span class="cur">All Items</span>'; return; }
    const path = folderPath(curFolder);
    let h = `<span onclick="nav(null)">All Items</span>`;
    path.forEach((f, i) => {
      h += `<span class="sep"><i class="fas fa-chevron-right"></i></span>`;
      h += i === path.length - 1
        ? `<span class="cur">${esc(f.name)}</span>`
        : `<span onclick="nav(${f.id})">${esc(f.name)}</span>`;
    });
    bc.innerHTML = h;
  }

  function renderMeta() {
    const dirs = childFolders(curFolder).length;
    const cnts = folderCounters(curFolder).length;
    let parts = [];
    if (dirs) parts.push(`${dirs} location${dirs > 1 ? 's' : ''}`);
    if (cnts) parts.push(`${cnts} item${cnts > 1 ? 's' : ''}`);
    document.getElementById('cmeta').textContent = parts.join('  ·  ') || 'Empty';
  }

  // ── Render Items ──
  function renderItems() {
    const area = document.getElementById('itemsArea');
    let dirs = childFolders(curFolder);
    let cnts = folderCounters(curFolder);
    if (searchQ) {
      const q = searchQ.toLowerCase();
      dirs = dirs.filter(f => f.name.toLowerCase().includes(q));
      cnts = cnts.filter(c => c.name.toLowerCase().includes(q));
    }
    if (!dirs.length && !cnts.length) {
      area.innerHTML = `<div class="empty">
        <i class="fas ${searchQ ? 'fa-search' : 'fa-boxes-stacked'}"></i>
        <p>${searchQ ? 'No results for "' + esc(searchQ) + '"' : 'Nothing counted here yet. Add an item or a location.'}</p>
        ${!searchQ ? `<div style="display:flex;gap:8px;margin-top:6px">
          <button class="btn btn-sm btn-accent" onclick="openNewCounter()"><i class="fas fa-plus"></i> New Item</button>
          <button class="btn btn-sm" onclick="openNewFolder()"><i class="fas fa-map-pin"></i> New Location</button>
        </div>` : ''}
      </div>`;
      return;
    }
    let h = '<div class="counter-grid">';
    dirs.forEach(f => {
      const cnt = countInFolder(f.id);
      const subs = childFolders(f.id).length;
      h += `<div class="cc is-folder" ondblclick="nav(${f.id})" oncontextmenu="event.preventDefault();folderCtx(event,${f.id})">
        <div class="cc-menu"><button onclick="event.stopPropagation();folderCtx(event,${f.id})" aria-label="Options"><i class="fas fa-ellipsis-v"></i></button></div>
        <div class="folder-ico"><i class="fas fa-box"></i></div>
        <div class="cc-name" title="${esc(f.name)}">${esc(f.name)}</div>
        <div class="cc-foot">
          <span>${cnt} item${cnt !== 1 ? 's' : ''}</span>
          ${subs ? `<span>${subs} sub</span>` : ''}
        </div>
      </div>`;
    });
    cnts.forEach(c => {
      const v = variance(c);
      const cls = varClass(v);
      h += `<div class="cc" data-cid="${c.id}" draggable="true"
        ondragstart="dragStart(event,${c.id})" ondragend="dragEnd(event)"
        oncontextmenu="event.preventDefault();counterCtx(event,${c.id})">
        <div class="cc-menu">
          <button onclick="event.stopPropagation();openEditCounter(${c.id})" title="Edit" aria-label="Edit"><i class="fas fa-pen"></i></button>
          <button class="del" onclick="event.stopPropagation();deleteCounter(${c.id})" title="Delete" aria-label="Delete"><i class="fas fa-trash"></i></button>
        </div>
        <div class="cc-info">
          <div class="cc-name" title="${esc(c.name)}">${esc(c.name)}</div>
          <div class="cc-target">Target ${c.expected.toLocaleString()}</div>
          <div class="cc-badge ${cls}" id="badge-${c.id}">${varLabel(v)}</div>
        </div>
        <div class="cc-display">
          <button class="cc-btn minus" onclick="event.stopPropagation();changeCount(${c.id},-1)" aria-label="Decrease count">\u2212</button>
          <div class="cc-val ${cls}" id="val-${c.id}">${c.count.toLocaleString()}</div>
          <button class="cc-btn plus" onclick="event.stopPropagation();changeCount(${c.id},1)" aria-label="Increase count">+</button>
        </div>
        <div class="cc-foot">
          <button onclick="event.stopPropagation();resetCounter(${c.id})">Reset to 0</button>
          <span class="cc-step-badge">Count by ${c.step}</span>
        </div>
      </div>`;
    });
    h += '</div>';
    area.innerHTML = h;
  }

  // ── Counter Actions ──
  function refreshCard(c) {
    const v = variance(c);
    const cls = varClass(v);
    const el = document.getElementById(`val-${c.id}`);
    if (el) {
      el.textContent = c.count.toLocaleString();
      el.className = `cc-val ${cls}`;
      el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    }
    const badge = document.getElementById(`badge-${c.id}`);
    if (badge) { badge.textContent = varLabel(v); badge.className = `cc-badge ${cls}`; }
  }

  function changeCount(id, dir) {
    const c = counters.find(x => x.id === id);
    if (!c) return;
    c.count += dir * c.step;
    refreshCard(c);
    updateStats();
    saveState();
  }

  function resetCounter(id) {
    const c = counters.find(x => x.id === id);
    if (!c) return;
    c.count = 0;
    renderItems();
    updateStats();
    saveState();
    toast(`"${c.name}" reset to 0`);
  }

  // ── Drag & Drop ──
  function dragStart(e, id) { dragId = id; e.dataTransfer.effectAllowed = 'move'; e.target.closest('.cc').classList.add('dragging'); }
  function dragEnd(e) { dragId = null; document.querySelectorAll('.cc.dragging').forEach(el => el.classList.remove('dragging')); document.querySelectorAll('.ti.drag-over').forEach(el => el.classList.remove('drag-over')); }
  function dropTo(fid) {
    if (dragId === null) return;
    const c = counters.find(x => x.id === dragId);
    if (!c || c.fid === fid) return;
    const target = fid ? folders.find(f => f.id === fid)?.name : 'All Items';
    c.fid = fid;
    dragId = null;
    saveState();
    toast(`Moved "${c.name}" to ${target}`);
    renderAll();
  }

  // ── Context Menus ──
  function hideCtx() { document.getElementById('ctx').classList.remove('show'); }
  function posCtx(menu, x, y) {
    menu.style.left = x + 'px'; menu.style.top = y + 'px';
    requestAnimationFrame(() => { const r = menu.getBoundingClientRect(); if (r.right > innerWidth) menu.style.left = (x - r.width) + 'px'; if (r.bottom > innerHeight) menu.style.top = (y - r.height) + 'px'; });
  }

  function folderCtx(e, fid) {
    hideCtx();
    const menu = document.getElementById('ctx');
    menu.innerHTML = `
      <div class="ctx-i" onclick="nav(${fid});hideCtx()"><i class="fas fa-box-open"></i> Open</div>
      <div class="ctx-i" onclick="openSubfolder(${fid});hideCtx()"><i class="fas fa-map-pin"></i> New Sub-location</div>
      <div class="ctx-i" onclick="openCounterIn(${fid});hideCtx()"><i class="fas fa-plus"></i> New Item Here</div>
      <div class="ctx-sep"></div>
      <div class="ctx-i" onclick="openRenameFolder(${fid});hideCtx()"><i class="fas fa-pen"></i> Rename</div>
      <div class="ctx-i dng" onclick="deleteFolder(${fid});hideCtx()"><i class="fas fa-trash"></i> Delete</div>`;
    posCtx(menu, e.clientX, e.clientY);
    menu.classList.add('show');
  }

  function counterCtx(e, cid) {
    hideCtx();
    const menu = document.getElementById('ctx');
    menu.innerHTML = `
      <div class="ctx-i" onclick="openEditCounter(${cid});hideCtx()"><i class="fas fa-pen"></i> Edit</div>
      <div class="ctx-i" onclick="openMoveCounter(${cid});hideCtx()"><i class="fas fa-arrows-alt"></i> Move To...</div>
      <div class="ctx-sep"></div>
      <div class="ctx-i" onclick="resetCounter(${cid});hideCtx()"><i class="fas fa-rotate-left"></i> Reset to Zero</div>
      <div class="ctx-i dng" onclick="deleteCounter(${cid});hideCtx()"><i class="fas fa-trash"></i> Delete</div>`;
    posCtx(menu, e.clientX, e.clientY);
    menu.classList.add('show');
  }

  document.addEventListener('click', hideCtx);

  // ── Modals ──
  function showModal(html) {
    document.getElementById('modalBox').innerHTML = html;
    document.getElementById('modalBg').classList.add('show');
    const inp = document.querySelector('#modalBox input');
    if (inp) setTimeout(() => inp.focus(), 80);
  }
  function hideModal() { document.getElementById('modalBg').classList.remove('show'); }
  document.getElementById('modalBg').addEventListener('click', e => { if (e.target === e.currentTarget) hideModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { hideModal(); hideCtx(); } });

  // New Location
  function openNewFolder() {
    const where = curFolder !== null ? `inside "${esc(folders.find(f => f.id === curFolder).name)}"` : 'at the top level';
    showModal(`<h3>New Location</h3><p class="sub">Create a location ${where}</p>
      <label for="fName">Location Name</label>
      <input id="fName" placeholder="e.g. Aisle 4 — Hardware" onkeydown="if(event.key==='Enter')createFolder()">
      <div class="modal-foot"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn btn-accent" onclick="createFolder()">Create</button></div>`);
  }
  function openSubfolder(pid) {
    const p = folders.find(f => f.id === pid);
    showModal(`<h3>New Sub-location</h3><p class="sub">Inside "${esc(p.name)}"</p>
      <label for="fName">Name</label>
      <input id="fName" placeholder="e.g. Shelf 3" onkeydown="if(event.key==='Enter')createFolder(${pid})">
      <div class="modal-foot"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn btn-accent" onclick="createFolder(${pid})">Create</button></div>`);
  }
  function createFolder(overridePid) {
    const v = document.getElementById('fName').value.trim();
    if (!v) { document.getElementById('fName').style.borderColor = 'var(--danger)'; return; }
    const pid = overridePid !== undefined ? overridePid : curFolder;
    folders.push({ id: gid(), name: v, pid });
    if (pid !== null) expanded.add(pid);
    saveState();
    hideModal(); toast(`Location "${v}" created`); renderAll();
  }

  // Rename Location
  function openRenameFolder(fid) {
    const f = folders.find(x => x.id === fid);
    showModal(`<h3>Rename Location</h3><p class="sub">Rename "${esc(f.name)}"</p>
      <label for="fName">New Name</label>
      <input id="fName" value="${esc(f.name)}" onkeydown="if(event.key==='Enter')renameFolder(${fid})">
      <div class="modal-foot"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn btn-accent" onclick="renameFolder(${fid})">Rename</button></div>`);
  }
  function renameFolder(fid) {
    const v = document.getElementById('fName').value.trim();
    if (!v) { document.getElementById('fName').style.borderColor = 'var(--danger)'; return; }
    folders.find(x => x.id === fid).name = v;
    saveState();
    hideModal(); toast(`Renamed to "${v}"`); renderAll();
  }

  // Delete Location
  function deleteFolder(fid) {
    const f = folders.find(x => x.id === fid);
    const dids = descIds(fid);
    const cnt = counters.filter(c => dids.includes(c.fid)).length;
    const subCnt = dids.length - 1;
    let msg = `Delete "${f.name}"`;
    if (subCnt || cnt) msg += ` along with ${subCnt} sub-location${subCnt !== 1 ? 's' : ''} and ${cnt} item${cnt !== 1 ? 's' : ''}`;
    msg += '? This cannot be undone.';
    showModal(`<h3>Delete Location</h3><p class="sub">${msg}</p>
      <div class="modal-foot"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn btn-danger" onclick="confirmDelFolder(${fid})"><i class="fas fa-trash"></i> Delete</button></div>`);
  }
  function confirmDelFolder(fid) {
    const f = folders.find(x => x.id === fid);
    const dids = descIds(fid);
    counters = counters.filter(c => !dids.includes(c.fid));
    folders = folders.filter(x => !dids.includes(x.id));
    if (curFolder !== null && dids.includes(curFolder)) curFolder = f.pid;
    saveState();
    hideModal(); toast(`"${f.name}" deleted`, 'err'); renderAll();
  }

  // New Item
  function openNewCounter() {
    const where = curFolder !== null ? `in "${esc(folders.find(f => f.id === curFolder).name)}"` : 'at the top level';
    showModal(`<h3>New Item</h3><p class="sub">Add a count sheet item ${where}</p>
      <label for="cName">Item Name</label>
      <input id="cName" placeholder="e.g. Red Widgets">
      <div class="field-row">
        <div><label for="cTarget">Target Qty</label><input id="cTarget" type="number" value="0"></div>
        <div><label for="cStep">Count By</label><input id="cStep" type="number" min="1" value="1"></div>
      </div>
      <div class="modal-foot"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn btn-accent" onclick="createCounter()">Create</button></div>`);
  }
  function openCounterIn(fid) {
    const f = folders.find(x => x.id === fid);
    showModal(`<h3>New Item</h3><p class="sub">In "${esc(f.name)}"</p>
      <label for="cName">Item Name</label>
      <input id="cName" placeholder="e.g. Red Widgets">
      <div class="field-row">
        <div><label for="cTarget">Target Qty</label><input id="cTarget" type="number" value="0"></div>
        <div><label for="cStep">Count By</label><input id="cStep" type="number" min="1" value="1"></div>
      </div>
      <div class="modal-foot"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn btn-accent" onclick="createCounter(${fid})">Create</button></div>`);
  }
  function createCounter(overrideFid) {
    const name = document.getElementById('cName').value.trim();
    if (!name) { document.getElementById('cName').style.borderColor = 'var(--danger)'; return; }
    let step = parseInt(document.getElementById('cStep').value) || 1;
    if (step < 1) step = 1;
    const expected = parseInt(document.getElementById('cTarget').value) || 0;
    counters.push({ id: gid(), name, count: 0, expected, step, fid: overrideFid !== undefined ? overrideFid : curFolder });
    saveState();
    hideModal(); toast(`"${name}" created`); renderAll();
  }

  // Edit Item
  function openEditCounter(cid) {
    const c = counters.find(x => x.id === cid);
    showModal(`<h3>Edit Item</h3><p class="sub">Modify "${esc(c.name)}"</p>
      <label for="cName">Name</label>
      <input id="cName" value="${esc(c.name)}">
      <div class="field-row">
        <div><label for="cTarget">Target Qty</label><input id="cTarget" type="number" value="${c.expected}"></div>
        <div><label for="cStep">Count By</label><input id="cStep" type="number" min="1" value="${c.step}"></div>
      </div>
      <label for="cVal">Counted Qty</label>
      <input id="cVal" type="number" value="${c.count}">
      <div class="modal-foot"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn btn-accent" onclick="updateCounter(${cid})">Save</button></div>`);
  }
  function updateCounter(cid) {
    const name = document.getElementById('cName').value.trim();
    if (!name) { document.getElementById('cName').style.borderColor = 'var(--danger)'; return; }
    let step = parseInt(document.getElementById('cStep').value) || 1;
    if (step < 1) step = 1;
    const expected = parseInt(document.getElementById('cTarget').value) || 0;
    const val = parseInt(document.getElementById('cVal').value) || 0;
    const c = counters.find(x => x.id === cid);
    c.name = name; c.step = step; c.count = val; c.expected = expected;
    saveState();
    hideModal(); toast(`"${name}" updated`); renderAll();
  }

  // Delete Item
  function deleteCounter(cid) {
    const c = counters.find(x => x.id === cid);
    showModal(`<h3>Delete Item</h3><p class="sub">Delete "${esc(c.name)}"? Its current count of ${c.count.toLocaleString()} will be lost. This cannot be undone.</p>
      <div class="modal-foot"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn btn-danger" onclick="confirmDelCounter(${cid})"><i class="fas fa-trash"></i> Delete</button></div>`);
  }
  function confirmDelCounter(cid) {
    const c = counters.find(x => x.id === cid);
    counters = counters.filter(x => x.id !== cid);
    saveState();
    hideModal();
    toast(`"${c.name}" deleted`, 'err');
    renderAll();
  }

  // Move Item
  function openMoveCounter(cid) {
    const c = counters.find(x => x.id === cid);
    let list = `<div class="move-opt${c.fid === null ? ' sel' : ''}" onclick="pickMove(this,null)" data-t="null"><i class="fas fa-warehouse"></i> All Items</div>`;
    list += buildMoveOpts(null, 0, c.fid);
    showModal(`<h3>Move Item</h3><p class="sub">Move "${esc(c.name)}" to a location</p>
      <label>Destination</label>
      <div class="move-list" id="moveList">${list}</div>
      <div class="modal-foot"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn btn-accent" onclick="confirmMove(${cid})">Move</button></div>`);
  }
  function buildMoveOpts(pid, depth, curFid) {
    return childFolders(pid).map(f => {
      const pad = depth * 18;
      return `<div class="move-opt${f.id === curFid ? ' sel' : ''}" style="padding-left:${13 + pad}px" onclick="pickMove(this,${f.id})" data-t="${f.id}"><i class="fas fa-box"></i> ${esc(f.name)}</div>${buildMoveOpts(f.id, depth + 1, curFid)}`;
    }).join('');
  }
  function pickMove(el, fid) {
    document.querySelectorAll('.move-opt').forEach(e => e.classList.remove('sel'));
    el.classList.add('sel');
  }
  function confirmMove(cid) {
    const c = counters.find(x => x.id === cid);
    const sel = document.querySelector('.move-opt.sel');
    const target = sel ? (sel.dataset.t === 'null' ? null : parseInt(sel.dataset.t)) : c.fid;
    if (target === c.fid) { hideModal(); return; }
    const tName = target ? folders.find(f => f.id === target)?.name : 'All Items';
    c.fid = target;
    saveState();
    hideModal(); toast(`Moved "${c.name}" to ${tName}`); renderAll();
  }

  // ── CSV Export ──
  function exportCSV() {
    if (!counters.length) { toast('No items to export', 'err'); return; }
    const rows = [['Location', 'Item', 'Target', 'Counted', 'Variance', 'Count By']];
    counters.forEach(c => {
      const loc = c.fid ? folderPath(c.fid).map(f => f.name).join(' / ') : 'Unfiled';
      rows.push([loc, c.name, c.expected, c.count, variance(c), c.step]);
    });
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `stock-take-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Stock take exported to CSV');
  }

  document.addEventListener('input', e => {
    if (e.target.id === 'searchInput') {
      searchQ = e.target.value.trim();
      document.querySelector('.search-box').classList.toggle('has-query', searchQ.length > 0);
      renderItems(); renderMeta();
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      document.getElementById('searchInput').focus();
    }
  });

  // ── Render All ──
  function renderAll() { renderTree(); renderBC(); renderMeta(); renderItems(); updateStats(); }
  renderAll();
</script>
</body>
</html>
